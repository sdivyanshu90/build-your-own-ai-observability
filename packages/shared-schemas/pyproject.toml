[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aiobs-schemas"
version = "0.1.0"
description = "Shared wire schemas, AI semantic conventions and canonical hashing for the AI Observability Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AI Observability Platform Contributors" }]
dependencies = [
  "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "hypothesis==6.164.0",
]

[tool.hatch.build.targets.wheel]
packages = ["python/aiobs_schemas"]

[tool.hatch.build.targets.sdist]
include = ["python", "json", "README.md"]
