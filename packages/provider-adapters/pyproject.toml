[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aiobs-provider-adapters"
version = "0.1.0"
description = "Normalising adapters that map provider-specific model responses onto the platform's canonical usage and configuration schema"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic==2.13.4",
  "aiobs-schemas==0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "mypy==2.3.0",
  "ruff==0.16.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiobs_providers"]
