[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aiobs-api"
version = "0.1.0"
description = "Backend platform library and HTTP application for the AI Observability Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  # web
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.0",
  "python-multipart==0.0.32",
  "sse-starlette==3.4.6",
  # models / validation
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "email-validator==2.3.0",
  "orjson==3.11.9",
  # relational storage
  "SQLAlchemy==2.0.51",
  "alembic==1.18.5",
  "asyncpg==0.31.0",
  "aiosqlite==0.22.1",
  "greenlet==3.5.4",
  # analytics storage
  "clickhouse-connect==1.6.0",
  # cache / kv
  "redis==8.1.0",
  # event bus
  "aiokafka==0.14.0",
  # object storage
  "aioboto3==15.5.0",
  # telemetry / logging
  "structlog==26.1.0",
  "prometheus-client==0.26.0",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "opentelemetry-proto==1.44.0",
  # auth
  "PyJWT[crypto]==2.13.0",
  "argon2-cffi==25.1.0",
  # misc
  "httpx==0.28.1",
  "Jinja2==3.1.6",
  "tenacity==9.1.4",
  "typing-extensions>=4.12",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "pytest-xdist==3.8.0",
  "hypothesis==6.164.0",
  "freezegun==1.5.5",
  "respx==0.23.1",
  "asgi-lifespan==2.1.0",
  "mypy==2.3.0",
  "ruff==0.16.1",
  "types-aioboto3==15.5.0",
]

[project.scripts]
aiobs-api = "aiobs_api.__main__:main"
aiobs-admin = "aiobs_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aiobs_api"]
