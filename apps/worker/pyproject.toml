[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aiobs-worker"
version = "0.1.0"
description = "Asynchronous ingestion, enrichment and maintenance worker for the AI Observability Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "aiobs-api==0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "mypy==2.3.0",
  "ruff==0.16.1",
]

[project.scripts]
aiobs-worker = "aiobs_worker.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aiobs_worker"]
