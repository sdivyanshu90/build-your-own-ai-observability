apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aiobs.fullname" . }}-worker
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # A worker may be taken out of service freely: its lease expires and the
      # batch is redelivered. Surging rather than shrinking keeps the consumer
      # group from rebalancing twice.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "aiobs.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "aiobs.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "aiobs.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: {{ include "aiobs.image" (dict "Values" .Values "Chart" .Chart "component" "worker") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            {{- include "aiobs.env" . | nindent 12 }}
            - name: AIOBS_WORKER__CONCURRENCY
              value: {{ .Values.worker.concurrency | quote }}
          # The worker serves no traffic, so it has no readiness probe. It
          # exposes a health file that the liveness probe checks: a consumer
          # that has stopped making progress is a worse failure than a crashed
          # one, because nothing notices.
          livenessProbe:
            exec:
              command: ["aiobs-worker", "--health-check"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts: {{- include "aiobs.writableVolumeMounts" . | nindent 12 }}
      volumes: {{- include "aiobs.writableVolumes" . | nindent 8 }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.worker.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "aiobs.fullname" . }}-worker
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "aiobs.fullname" . }}-worker
  minReplicas: {{ .Values.worker.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.worker.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.worker.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleUp:
      # Consumer lag is the real signal; CPU is a proxy for it. Scaling up
      # quickly is safe because an idle worker costs almost nothing, while lag
      # costs freshness on every dashboard.
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 600
{{- end }}
{{- if .Values.worker.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "aiobs.fullname" . }}-worker
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  minAvailable: {{ .Values.worker.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "aiobs.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
{{- end }}
