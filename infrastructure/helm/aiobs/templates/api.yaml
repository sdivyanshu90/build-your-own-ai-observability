apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aiobs.fullname" . }}-api
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never go below the configured replica count during a rollout: the
      # ingest path is the one thing that must not drop requests, because a
      # dropped span is gone.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "aiobs.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "aiobs.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        {{- with .Values.extraAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "aiobs.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      containers:
        - name: api
          image: {{ include "aiobs.image" (dict "Values" .Values "Chart" .Chart "component" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env: {{- include "aiobs.env" . | nindent 12 }}
          # Three distinct probes, because they answer three different
          # questions. Conflating them is how a slow dependency turns into a
          # restart loop that makes the outage worse.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
            failureThreshold: 40      # tolerate a slow first migration check
          livenessProbe:
            # "Is this process wedged?" -- deliberately does not touch a
            # dependency, so a ClickHouse outage cannot cause a restart storm.
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            # "Should this pod receive traffic?" -- this one *does* check
            # dependencies, so an unhealthy replica is removed from the service
            # without being killed.
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              # Give the load balancer time to stop sending new requests before
              # the process starts shutting down.
              exec:
                command: ["sleep", "5"]
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts: {{- include "aiobs.writableVolumeMounts" . | nindent 12 }}
      volumes: {{- include "aiobs.writableVolumes" . | nindent 8 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiobs.fullname" . }}-api
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "aiobs.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "aiobs.fullname" . }}-api
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "aiobs.fullname" . }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      # Ingest traffic is spiky; scaling down eagerly means scaling back up a
      # minute later, and the cold replica drops spans while it warms.
      stabilizationWindowSeconds: 300
{{- end }}
{{- if .Values.api.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "aiobs.fullname" . }}-api
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "aiobs.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}
