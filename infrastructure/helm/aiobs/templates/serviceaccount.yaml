{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aiobs.serviceAccountName" . }}
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# The platform calls no Kubernetes API, so its token is never needed inside the
# pod. Not mounting it removes a credential an attacker could otherwise use to
# pivot.
automountServiceAccountToken: false
{{- end }}
