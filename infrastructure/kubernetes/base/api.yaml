apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiobs-api
  namespace: aiobs
  labels:
    app.kubernetes.io/name: aiobs
    app.kubernetes.io/component: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # A dropped span cannot be re-sent by the application, so capacity never
      # dips below the configured replica count during a rollout.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aiobs
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiobs
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: aiobs
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/aiobs/api:0.1.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: aiobs-config
          env:
            - name: AIOBS_DATABASE__URL
              valueFrom: { secretKeyRef: { name: aiobs, key: database-url } }
            - name: AIOBS_AUTH__JWT_SECRET
              valueFrom: { secretKeyRef: { name: aiobs, key: jwt-secret } }
            - name: AIOBS_AUTH__API_KEY_PEPPER
              valueFrom: { secretKeyRef: { name: aiobs, key: api-key-pepper } }
            - name: AIOBS_SECURITY__CURSOR_SECRET
              valueFrom: { secretKeyRef: { name: aiobs, key: cursor-secret } }
            - name: AIOBS_ANALYTICS__PASSWORD
              valueFrom: { secretKeyRef: { name: aiobs, key: analytics-password } }
            - name: AIOBS_OBJECTS__ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: aiobs, key: objects-access-key-id } }
            - name: AIOBS_OBJECTS__SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: aiobs, key: objects-secret-access-key } }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            # Does not touch a dependency: a ClickHouse outage must not turn
            # into a restart storm that removes the API as well.
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            # Does check dependencies, so an unhealthy replica leaves the
            # service without being killed.
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: aiobs
              app.kubernetes.io/component: api
---
apiVersion: v1
kind: Service
metadata:
  name: aiobs-api
  namespace: aiobs
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: aiobs
    app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aiobs-api
  namespace: aiobs
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aiobs
      app.kubernetes.io/component: api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aiobs-api
  namespace: aiobs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aiobs-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
