apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiobs-web
  namespace: aiobs
  labels:
    app.kubernetes.io/name: aiobs
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aiobs
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiobs
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: aiobs
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/aiobs/web:0.1.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3000
          env:
            # The browser talks to the API directly, so this is the public URL
            # rather than the in-cluster service name.
            - name: NEXT_PUBLIC_API_URL
              value: "https://observability.example.com"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          livenessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aiobs-web
  namespace: aiobs
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: aiobs
    app.kubernetes.io/component: web
