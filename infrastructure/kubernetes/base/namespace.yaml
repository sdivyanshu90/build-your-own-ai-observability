apiVersion: v1
kind: Namespace
metadata:
  name: aiobs
  labels:
    # Enforce the restricted Pod Security Standard. The workloads already run
    # as a non-root user with no capabilities, so this costs nothing and stops
    # a future change from quietly relaxing it.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
