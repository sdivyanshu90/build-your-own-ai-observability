apiVersion: batch/v1
kind: Job
metadata:
  name: aiobs-migrate
  namespace: aiobs
  annotations:
    # Re-apply this Job with a new name (or delete it first) on each release.
    # Migrations are expand-only, so running them *before* the new code is
    # deployed leaves the old replicas working throughout.
    aiobs.io/run-before: "deployment rollout"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiobs
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      serviceAccountName: aiobs
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/aiobs/api:0.1.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/sh
            - -c
            - |
              set -e
              python -m alembic -c database/postgres/alembic.ini upgrade head
              aiobs-admin migrate-analytics
          envFrom:
            - configMapRef:
                name: aiobs-config
          env:
            - name: AIOBS_DATABASE__URL
              valueFrom: { secretKeyRef: { name: aiobs, key: database-url } }
            - name: AIOBS_ANALYTICS__PASSWORD
              valueFrom: { secretKeyRef: { name: aiobs, key: analytics-password } }
            - name: AIOBS_AUTH__JWT_SECRET
              valueFrom: { secretKeyRef: { name: aiobs, key: jwt-secret } }
            - name: AIOBS_AUTH__API_KEY_PEPPER
              valueFrom: { secretKeyRef: { name: aiobs, key: api-key-pepper } }
            - name: AIOBS_SECURITY__CURSOR_SECRET
              valueFrom: { secretKeyRef: { name: aiobs, key: cursor-secret } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
