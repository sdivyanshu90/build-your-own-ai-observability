; Alembic configuration for the relational metadata store.
;
; The database URL is NOT set here. It is read from AIOBS_DATABASE__URL by
; env.py, so migrations always target the same database the application does
; and a credential never lands in a committed file.

[alembic]
script_location = %(here)s
prepend_sys_path = .
version_path_separator = os
# Timestamped, ordered revision filenames make the history readable in a
# directory listing, which matters when reviewing a migration PR.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
hooks =
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
